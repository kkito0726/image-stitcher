worker_processes auto;
# warn だと大きなアップロードのたびにバッファリングの警告 (接続元とリクエスト行を含む) が出るため error にする
error_log /var/log/nginx/error.log error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # アクセスログには IP アドレスを記録しない (利用者への表示: src/app/layout.tsx のフッター)。
    # 利用状況の把握用に、フロントエンドが送る匿名 ID (UUID 形式のみ) と User-Agent を記録する
    map $http_x_client_id $client_id {
        default "-";
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_client_id;
    }

    # ダウンロード URL の結果 ID は取得用の鍵なので伏せる。
    # 生の URI だと // や %2F などの表記揺れで漏れるため、正規化後の $uri で判定する
    map $uri $masked_request_uri {
        default $request_uri;
        "~^/api/stitch/[^/]+/download" "/api/stitch/***/download$is_args$args";
    }

    log_format main '[$time_local] "$request_method $masked_request_uri $server_protocol" '
                    '$status $body_bytes_sent $request_time '
                    '"$http_user_agent" client=$client_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache static assets
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://image-stitcher-backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Increase timeout for image processing
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            client_max_body_size 100M;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
